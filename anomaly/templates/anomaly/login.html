<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · NYC Taxi Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1C7293 0%,#155870 100%);
  color:#2C3E50;padding:20px;
}
.card{
  background:#fff;width:100%;max-width:380px;border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);padding:36px 32px;
}
.brand{text-align:center;margin-bottom:26px}
.brand .icon{font-size:44px;line-height:1}
.brand h1{font-size:20px;font-weight:800;color:#1C7293;margin-top:8px}
.brand p{font-size:12px;color:#8C98A4;margin-top:4px}
label{display:block;font-size:11px;font-weight:700;color:#8C98A4;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fg{margin-bottom:16px}
input{
  width:100%;height:44px;border:1px solid #DDE3EA;border-radius:9px;
  padding:0 14px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus{border-color:#1C7293;box-shadow:0 0 0 3px rgba(28,114,147,.12)}
.btn{
  width:100%;height:46px;background:#1C7293;color:#fff;border:none;border-radius:9px;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:background .15s;
}
.btn:hover{background:#155870}
.err{
  background:#FDEDEC;border:1px solid #F5C6C0;color:#C0392B;
  font-size:13px;border-radius:8px;padding:10px 12px;margin-bottom:18px;
}
.alt{text-align:center;font-size:13px;color:#8C98A4;margin-top:20px}
.alt a{color:#1C7293;font-weight:700;text-decoration:none}
.alt a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="icon">🚕</div>
      <h1>NYC Taxi Dashboard</h1>
      <p>Anomaly Detection &amp; Time-Series Forecasting</p>
    </div>

    {% if form.errors %}
      <div class="err">Incorrect username or password. Please try again.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="fg">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" required autofocus>
      </div>
      <div class="fg">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn">Log In</button>
    </form>

    <div class="alt">
      Don't have an account? <a href="{% url 'register' %}">Sign up</a>
    </div>
  </div>
</body>
</html>
